server:
  address: 0.0.0.0  # 强制允许外部访问
  port: 8080

spring:
  profiles:
    active: cjn
  application:
    name: healthy
  datasource:
    url: "jdbc:mysql://${datasource.host:localhost}:${datasource.port:3319}/${datasource.dbname:healthy}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=false"
    username: "${datasource.username:root}"
    password: "${datasource.password:root}"
  jpa:
    generate-ddl: true
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.MySQLDialect"
    hibernate:
      ddl-auto: create
    show-sql: true
  # 上传文件大小限制
  servlet:
    multipart:
      enabled: true
      max-file-size: ${file.size:20MB}
      max-request-size: ${file.size:20MB}

---

spring:
  config:
    activate:
      on-profile: jbz
  application:
    name: healthy
  datasource:
    url: "jdbc:mysql://${datasource.host:localhost}:${datasource.port:3306}/${datasource.dbname:healthy}?useUnicode=true&characterEncoding=utf-8"
    username: "${datasource.username:yunzhi}"
    password: "${datasource.password:yunzhi}"
  jpa:
    generate-ddl: true
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.MySQLDialect"
    hibernate:
      ddl-auto: update
    show-sql: true
  # 上传文件大小限制
  servlet:
    multipart:
      enabled: true
